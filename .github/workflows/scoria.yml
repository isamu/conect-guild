name: scoria

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Runs the project's code (npm ci, tests, scoria) with read-only permissions.
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-sarif: ${{ steps.sarif.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Installed dependencies let scoria run tsc, knip and the cycle check.
      - run: npm ci --ignore-scripts
      # scoria only reads an existing coverage report (coverage/lcov.info); it never runs the tests itself.
      - run: npm run test:coverage
      # Report only (mode: report in scoria.config.json); the job summary shows the change since .scoria/baseline.json.
      # Pinned to an exact version but not added to package.json: its own dependency tree carries
      # npm-audit advisories that would otherwise show up as this project's vulnerabilities.
      - run: npx -y scoria@0.3.0 --sarif scoria.sarif
        env:
          # Keeps install scripts of scoria's dependency tree from running, as with npm ci above.
          npm_config_ignore_scripts: 'true'
      - id: sarif
        if: ${{ !cancelled() }}
        run: echo "present=${{ hashFiles('scoria.sarif') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.sarif.outputs.present == 'true' }}
        with:
          name: scoria-sarif
          path: scoria.sarif
          retention-days: 7

  # Only this job can write code scanning results, and it runs no project code.
  # Skipped for pull requests from forks, whose head is not this repository.
  upload:
    needs: measure
    if: ${{ needs.measure.outputs.has-sarif == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    # Actions in this job are pinned to commit SHAs because it holds a write permission.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scoria-sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scoria.sarif
          category: scoria
